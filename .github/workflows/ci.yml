
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI pipeline:
# 1. Install dependencies
# 2. Lint
# 3. Type-check
# 4. Install KoSIT, veraPDF, and Mustang
# 5. Run tests with coverage and strict validation
#
# Any failed step fails the workflow.
# Missing external validators must fail tests, not be silently skipped.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install exact dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Check code style and types.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Install KoSIT validator, XRechnung configuration,
      # and a portable JRE if system Java is unavailable.
      - name: Set up KoSIT
        run: bash scripts/setup-kosit.sh

      # Install veraPDF CLI for PDF/A validation.
      # Can reuse Java installed by the KoSIT setup.
      - name: Set up veraPDF
        run: bash scripts/setup-verapdf.sh

      # Install Mustang Project CLI for independent
      # e-invoice validation.
      # Can reuse Java from the previous setup steps.
      - name: Set up Mustang
        run: bash scripts/setup-mustang.sh

      # Run the full test suite with V8 coverage.
      #
      # Strict validation ensures missing external tools
      # cause test failures rather than skipped tests.
      #
      # Coverage must also meet the thresholds defined
      # in vitest.config.ts.
      - name: Run tests with strict validation
        run: npm run test:coverage
        env:
          OPENINVOICE_STRICT_VALIDATION: "1"
